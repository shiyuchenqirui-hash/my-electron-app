<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <title>Session Lab</title>
  </head>
  <body>
    <h1 id="window-title">Session Lab</h1>
    <p>第一轮：两个窗口，同一个 partition。</p>
    <p>先在 A 写入，再到 B 读取。输出是读取时的快照，不自动同步。</p>
    <button id="write-cookie">写入测试 Cookie</button>
    <button id="read-cookie">读取 Cookie</button>
    <button id="remove-cookie">删除测试 Cookie</button>
    <pre id="result" aria-live="polite">正在读取……</pre>
    <p>仅操作 session-lab.example 的 study-cookie，不访问网络。</p>
    <p>sameSessionAsPeer：与另一个实验窗口是否为同一个 Session。null 表示另一个窗口已关闭。</p>
    <script src="session-renderer.js"></script>
  </body>
</html>
